[package]
name = "doorman-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
doorman-core = { path = "../../crates/doorman-core" }
serde_json.workspace = true
slint = { version = "1.17", features = ["unstable-winit-030"] }

[build-dependencies]
slint-build = "1.17"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSView", "NSVisualEffectView", "NSWindow", "NSResponder", "NSGraphics", "NSColor"] }
raw-window-handle = "0.6"

[package.metadata.bundle]
name = "Doorman"
identifier = "dev.doorman.desktop"
# cargo-bundle resolves icon paths from the workspace root.
icon = ["apps/doorman-desktop/assets/doorman-app.svg"]
category = "Developer Tool"
short_description = "Friendly names for local apps"
long_description = "A small desktop companion for named localhost routes."
copyright = "Copyright 2026 Doorman contributors"
osx_minimum_system_version = "13.0"
