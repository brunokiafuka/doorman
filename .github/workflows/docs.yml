name: Documentation

on:
  pull_request:
    paths: ['docs/**', 'apps/doorman-desktop/assets/fonts/**', 'install.sh', '.github/workflows/docs.yml']
  push:
    branches: [main]
    paths: ['docs/**', 'apps/doorman-desktop/assets/fonts/**', 'install.sh', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: doorman-docs
          path: docs/dist
