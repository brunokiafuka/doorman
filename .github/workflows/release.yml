name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match workspace version $version"
            exit 1
          fi

      - name: Test
        run: cargo test --workspace --locked

      - name: Install cargo-bundle
        # 0.12 changed the bundle metadata schema; keep releases reproducible.
        run: cargo install cargo-bundle --version 0.11.0 --locked

      - name: Package universal app
        env:
          DOORMAN_UNIVERSAL: "1"
        run: scripts/package-macos.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            outputs/Doorman-macos.zip \
            outputs/Doorman-macos.zip.sha256 \
            install.sh \
            --title "Doorman $GITHUB_REF_NAME" \
            --generate-notes
